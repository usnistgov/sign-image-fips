name: act-test
on: [push, workflow_dispatch]

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign image (self-test)
        uses: ./
        with:
          image: localhost:5000/app:latest
          private-key: ${{ secrets.SIGNING_KEY }}
          verify-inclusion-proof: 'false'   # first pass: pure wiring, no network
          tlog-upload: false